name: Build, Test, and Publish

on:
  push:
    branches: [production]
    tags: ['v*']
  pull_request:
    branches: [production]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: '11.0.x'
  GITHUB_PACKAGES_URL: https://nuget.pkg.github.com/alulore/index.json
  PACKAGE_NAME: Auxil

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Build.targets', '.agentfile/*.props', '.agentfile/*.targets', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Auxil.sln

      - name: Build
        run: dotnet build Auxil.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Auxil.sln --configuration Release --no-build --verbosity normal

      - name: Choose the package version
        if: github.event_name == 'push'
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            MAJOR=$(grep -oP '(?<=<Version>)[0-9]+' Auxil/Auxil.csproj | head -n 1)
            if [[ -z "$MAJOR" ]]; then
              echo "Could not read the major version from Auxil/Auxil.csproj" >&2
              exit 1
            fi
            VERSION="${MAJOR}.$(date +%Y).$(date +%j).${GITHUB_RUN_NUMBER}"
          fi
          echo "Package version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Pack
        if: github.event_name == 'push'
        run: dotnet pack Auxil/Auxil.csproj --configuration Release --no-build --output ./packages /p:Version=${{ steps.version.outputs.version }}

      - name: Keep the package for the publish job
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: auxil-package
          path: ./packages/*.nupkg
          retention-days: 7

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Fetch the package
        uses: actions/download-artifact@v8
        with:
          name: auxil-package
          path: ./packages

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Read the stable version
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget add source "$GITHUB_PACKAGES_URL" \
            --name github \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text
          dotnet nuget push ./packages/*.nupkg --source github --skip-duplicate

      - name: Remove temporary CI versions
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/github-script@v8
        env:
          STABLE_VERSION: ${{ steps.version.outputs.version }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const packageType = 'nuget';
            const packageName = process.env.PACKAGE_NAME;
            const stableVersion = process.env.STABLE_VERSION;

            try {
              const versions = await github.paginate(
                github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg,
                {
                  org: context.repo.owner,
                  package_type: packageType,
                  package_name: packageName,
                  per_page: 100,
                },
              );

              const temporaryVersions = versions.filter((version) => {
                const parts = version.name.split('.');
                return version.name !== stableVersion
                  && parts.length === 4
                  && parts.every((part) => /^\d+$/.test(part));
              });

              core.info(`Found ${temporaryVersions.length} temporary CI versions.`);
              const failures = [];

              for (const version of temporaryVersions) {
                try {
                  await github.rest.packages.deletePackageVersionForOrg({
                    org: context.repo.owner,
                    package_type: packageType,
                    package_name: packageName,
                    package_version_id: version.id,
                  });
                  core.info(`Deleted ${version.name}.`);
                } catch (error) {
                  failures.push(`${version.name}: ${error.message}`);
                  core.error(`Failed to delete ${version.name}: ${error.message}`);
                }
              }

              if (failures.length > 0) {
                throw new Error(`Failed to delete ${failures.length} temporary CI version(s).`);
              }
            } catch (error) {
              if (error.status === 404) {
                core.info('Auxil has no package versions to clean up.');
                return;
              }
              throw error;
            }
